SPECIFICATION Spec

\* Same degraded peer set as the other configs.
CONSTANT Peers = {"p_tip", "p_lag"}
CONSTANT MaxBlock = 2
CONSTANT LaggingPeers = {"p_lag"}
CONSTANT LagTip = 1
CONSTANT MaxRetries = 2

\* Isolates the registry-poisoning defect: a transient error marks a peer
\* missing for a block. BuggyDrop is irrelevant to this safety property.
CONSTANT BuggyRouting = TRUE
CONSTANT BuggyDrop = TRUE

CHECK_DEADLOCK FALSE

\* Expected to FAIL in two steps: requesting block 1 from p_tip then hitting a
\* transient error marks p_tip missing for block 1 — a block it actually holds.
\* This is the formal "a timeout is not a notfound."
INVARIANT RegistryHonest
