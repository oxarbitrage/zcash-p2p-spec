\* Both nodes advertise the new version; b lags behind the activation
\* height and syncs across it. Expected: the connection is never touched
\* (UpgradedNeverDropped) and b catches up - divergent activation
\* observation is harmless between upgraded nodes.
SPECIFICATION Spec
CONSTANT MaxBlock = 4
CONSTANT ActivationHeight = 3
CONSTANT NewMin = 2
CONSTANT OldVer = 1
CONSTANT VerB = 2
CONSTANT BanObsolete = FALSE
CHECK_DEADLOCK FALSE
PROPERTY CatchesUp
INVARIANT TypeOK
INVARIANT UpgradedNeverDropped
