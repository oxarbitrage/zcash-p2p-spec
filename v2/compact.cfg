\* Draft-conformant requester: reconstruction failure falls back to
\* get-blocks and is never penalized. Every property is expected to hold
\* under maximal nonce churn and lost re-announcements.
SPECIFICATION Spec
CONSTANT NTx = 2
CONSTANT MaxAnnounce = 2
CONSTANT Fallback = TRUE
CONSTANT PenalizeReconFail = FALSE
CHECK_DEADLOCK FALSE
PROPERTY EventuallyHasBlock
INVARIANT TypeOK
INVARIANT NoHonestPenalty
INVARIANT WrongTxNeverAccepted
