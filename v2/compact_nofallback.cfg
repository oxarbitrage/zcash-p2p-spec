\* The requester retries the compact path instead of falling back to
\* get-blocks. EventuallyHasBlock is expected to be VIOLATED: a
\* re-announcement lost while the requester was mid-attempt leaves every
\* SHORTID reference it can ever send stale, and no rule other than the
\* SHOULD-fallback delivers the block.
SPECIFICATION Spec
CONSTANT NTx = 2
CONSTANT MaxAnnounce = 2
CONSTANT Fallback = FALSE
CONSTANT PenalizeReconFail = FALSE
CHECK_DEADLOCK FALSE
PROPERTY EventuallyHasBlock
INVARIANT TypeOK
INVARIANT NoHonestPenalty
INVARIANT WrongTxNeverAccepted
