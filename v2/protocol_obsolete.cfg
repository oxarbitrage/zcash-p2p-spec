\* Two peers, one of which may advertise a protocol version below the
\* minimum. The connection is expected to close with OBSOLETE and nothing
\* else (draft: "Handshake Validation"); every property still holds because
\* OBSOLETE is the one sanctioned close in this phase.
SPECIFICATION Spec

CONSTANT InitialPeers = {"peer1", "peer2"}
CONSTANT MaxStreams = 3
CONSTANT MaxBlock = 2
CONSTANT MaxRestarts = 1
CONSTANT MinVersion = 170200
CONSTANT Versions = {170199, 170200}
CONSTANT StrictSingleton = FALSE
CONSTANT RefusePreHandshake = FALSE

CHECK_DEADLOCK FALSE

PROPERTY HandshakeCompletes
PROPERTY AnnouncementsFlow

INVARIANT TypeOK
INVARIANT SlotsConsistent
INVARIANT OneHandshakeStream
INVARIANT HandshakeBeforeStreams
INVARIANT NegotiatedVersionIsMin
INVARIANT SenderSingleton
INVARIANT CloseJustified
INVARIANT NoHonestProtocolError
