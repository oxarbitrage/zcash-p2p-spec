\* Two peers, tolerant receiver, and each sender may finish or reset its
\* announcement stream once and open the replacement the draft allows. The
\* chain is short so that the announcement-stream lifecycle, not
\* synchronization, dominates the state space. Every property is expected to
\* hold; AnnouncementsFlow in particular requires the sender to re-announce
\* its tip on the replacement stream.
SPECIFICATION Spec

CONSTANT InitialPeers = {"peer1", "peer2"}
CONSTANT MaxStreams = 3
CONSTANT MaxBlock = 2
CONSTANT MaxRestarts = 1
CONSTANT MaxHeaders = 2
CONSTANT MaxBlocksPerRequest = 2
CONSTANT MinVersion = 170200
CONSTANT Versions = {170200}
CONSTANT StrictSingleton = FALSE
CONSTANT ByzantinePeers = {}
CONSTANT MaxMischief = 0
CONSTANT PunishUnknownType = FALSE
CONSTANT RefusePreHandshake = FALSE

CHECK_DEADLOCK FALSE

PROPERTY HandshakeCompletes
PROPERTY AnnouncementsFlow
PROPERTY EventualConsensus

INVARIANT TypeOK
INVARIANT SlotsConsistent
INVARIANT OneHandshakeStream
INVARIANT HandshakeBeforeStreams
INVARIANT NegotiatedVersionIsMin
INVARIANT SenderSingleton
INVARIANT CloseJustified
INVARIANT BlocksContiguous
INVARIANT RequestsAfterHandshake
INVARIANT ResponsesBounded
INVARIANT NoHonestPenalty
INVARIANT NoHonestProtocolError
