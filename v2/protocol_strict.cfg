\* Two peers, strict receiver: a second open announcement stream of the same
\* type from a peer is treated as a PROTOCOL_ERROR, the literal reading of the
\* draft's "Announcement Streams" section.
\*
\* NoHonestProtocolError is expected to be VIOLATED: a sender that finishes or
\* resets its announcement stream and opens a replacement, both allowed by the
\* draft, is disconnected when the replacement's type byte is consumed before
\* the old stream's FIN or reset.
SPECIFICATION Spec

CONSTANT InitialPeers = {"peer1", "peer2"}
CONSTANT MaxStreams = 4
CONSTANT MaxBlock = 3
CONSTANT MaxRestarts = 1
CONSTANT MaxHeaders = 2
CONSTANT MaxBlocksPerRequest = 2
CONSTANT MinVersion = 170200
CONSTANT Versions = {170200}
CONSTANT StrictSingleton = TRUE
CONSTANT ByzantinePeers = {}
CONSTANT MaxMischief = 0
CONSTANT PunishUnknownType = FALSE
CONSTANT RefusePreHandshake = FALSE

CHECK_DEADLOCK FALSE

INVARIANT NoHonestProtocolError
