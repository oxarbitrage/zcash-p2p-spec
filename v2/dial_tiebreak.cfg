\* Asymmetric tie-break: both peers keep the connection dialled by the fixed
\* Lower peer. The peers agree on the survivor, so every property including
\* EventuallyOneConnection is expected to hold.
SPECIFICATION Spec
CONSTANT Peers = {"a", "b"}
CONSTANT Lower = "a"
CONSTANT Policy = "tiebreak"
CHECK_DEADLOCK FALSE
PROPERTY EventuallyOneConnection
INVARIANT TypeOK
INVARIANT AtMostOnePerView
