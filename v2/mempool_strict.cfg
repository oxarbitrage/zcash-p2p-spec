\* Strict responder: a second subscription observed while one is being
\* served is a connection error, the literal reading of "get-mempool".
\* NoHonestProtocolError is expected to be VIOLATED: the requester cancels
\* and re-subscribes, and the new stream's type byte is observed before the
\* old stream's CANCELLED.
SPECIFICATION Spec
CONSTANT MaxSubs = 3
CONSTANT StrictSub = TRUE
CHECK_DEADLOCK FALSE
INVARIANT NoHonestProtocolError
