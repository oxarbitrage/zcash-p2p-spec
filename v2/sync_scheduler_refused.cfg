\* A REFUSED stream reset is treated as a not-found. RegistryHonest is
\* expected to be VIOLATED: the tip peer refuses one request for block 2 and
\* is marked missing for a block it holds.
SPECIFICATION Spec
CONSTANT Peers = {"p_tip", "p_lag"}
CONSTANT MaxBlock = 2
CONSTANT LaggingPeers = {"p_lag"}
CONSTANT LagTip = 1
CONSTANT MaxRetries = 2
CONSTANT UnresponsiveLimit = 2
CONSTANT TreatRefusedAsMissing = TRUE
CONSTANT TreatTruncatedAsMissing = FALSE
CONSTANT BuggyTimeout = FALSE
CONSTANT Redial = TRUE
CHECK_DEADLOCK FALSE
INVARIANT RegistryHonest
