\* Same as epoch_upgrade.cfg, but the implementation bans the address it
\* drops with OBSOLETE. CatchesUp is expected to be VIOLATED: being
\* unupgraded is not misbehavior, the ban outlives b's software upgrade,
\* and the upgraded peer can never reconnect.
SPECIFICATION Spec
CONSTANT MaxBlock = 4
CONSTANT ActivationHeight = 3
CONSTANT NewMin = 2
CONSTANT OldVer = 1
CONSTANT VerB = 1
CONSTANT BanObsolete = TRUE
CHECK_DEADLOCK FALSE
PROPERTY CatchesUp
INVARIANT TypeOK
