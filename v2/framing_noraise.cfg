\* The receiver reads the preamble field as a CONCURRENT limit and so
\* never raises it (concurrency never exceeds one); the sender counts
\* cumulatively as the framing section defines. ReplacementsComplete is
\* expected to be VIOLATED: the second replacement stream silently never
\* opens - announcements stop with no error anywhere.
SPECIFICATION Spec
CONSTANT Total = 3
CONSTANT InitMaxData = 3
CONSTANT InitMaxStreamsUni = 2
CONSTANT MaxReplace = 2
CONSTANT GrantPerRecord = TRUE
CONSTANT RaiseOnClose = FALSE
CONSTANT SenderReadsConcurrent = FALSE
CHECK_DEADLOCK FALSE
PROPERTY BulkDelivered
PROPERTY ReplacementsComplete
INVARIANT TypeOK
INVARIANT StrictSingletonSafeHere
INVARIANT NoHonestProtocolError
