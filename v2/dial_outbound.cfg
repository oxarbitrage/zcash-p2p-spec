\* Symmetric policy: each node refuses the inbound duplicate and keeps its
\* own dial. EventuallyOneConnection is expected to be VIOLATED: under
\* simultaneous dials each node keeps the connection the other refuses, both
\* connections die, both nodes redial, and adversarial timing repeats the
\* race forever. AtMostOnePerView still holds - the flap lives entirely in
\* the gap the draft's one-sentence rule leaves open.
SPECIFICATION Spec
CONSTANT Peers = {"a", "b"}
CONSTANT Lower = "a"
CONSTANT Policy = "prefer_outbound"
CHECK_DEADLOCK FALSE
PROPERTY EventuallyOneConnection
INVARIANT TypeOK
INVARIANT AtMostOnePerView
