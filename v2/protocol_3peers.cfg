\* Three peers with symmetry reduction: a bounded stress test of the safety
\* invariants. Peers are model values so that Permutations(InitialPeers) is
\* sound; liveness is deliberately not checked here (symmetry can miss
\* liveness counterexamples, see README).
SPECIFICATION Spec

CONSTANT peer1 = peer1
CONSTANT peer2 = peer2
CONSTANT peer3 = peer3
CONSTANT InitialPeers = {peer1, peer2, peer3}
CONSTANT MaxStreams = 3
CONSTANT MaxBlock = 2
CONSTANT MaxRestarts = 1
CONSTANT MinVersion = 170200
CONSTANT Versions = {170200}
CONSTANT StrictSingleton = FALSE
CONSTANT RefusePreHandshake = FALSE

SYMMETRY Symmetry

CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT SlotsConsistent
INVARIANT OneHandshakeStream
INVARIANT HandshakeBeforeStreams
INVARIANT NegotiatedVersionIsMin
INVARIANT SenderSingleton
INVARIANT CloseJustified
INVARIANT NoHonestProtocolError
