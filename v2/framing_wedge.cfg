\* The peer advertises less connection credit than one record - which no
\* rule forbids: the draft sets a minimum for initial_max_stream_data but
\* none for initial_max_data - and the receiver grants credit only after
\* processing a complete record. Both conforming; BulkDelivered is
\* expected to be VIOLATED: the sender stalls mid-record forever.
SPECIFICATION Spec
CONSTANT Total = 3
CONSTANT InitMaxData = 2
CONSTANT InitMaxStreamsUni = 2
CONSTANT MaxReplace = 2
CONSTANT GrantPerRecord = TRUE
CONSTANT RaiseOnClose = TRUE
CONSTANT SenderReadsConcurrent = FALSE
CHECK_DEADLOCK FALSE
PROPERTY BulkDelivered
PROPERTY ReplacementsComplete
INVARIANT TypeOK
INVARIANT StrictSingletonSafeHere
INVARIANT NoHonestProtocolError
