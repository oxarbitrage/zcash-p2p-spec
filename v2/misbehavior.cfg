\* Fixed behaviour: only provable violations score, and scores are keyed by
\* address. Honest peers on divergent forks are never banned, and a
\* persistent attacker always is.
SPECIFICATION Spec
CONSTANT Peers = {"honest1", "byz1"}
CONSTANT Byzantine = {"byz1"}
CONSTANT BanThreshold = 100
CONSTANT PenalizeNonConnecting = FALSE
CONSTANT PenalizeRequestedInvalid = FALSE
CONSTANT PerConnectionScore = FALSE
CHECK_DEADLOCK FALSE
PROPERTY PersistentAttackerBanned
INVARIANT TypeOK
INVARIANT NoHonestBan
INVARIANT BanIsFinal
