\* The requester counts the FIRST delivered block against the byte budget
\* - the natural off-by-one. NoHonestFlood is expected to be VIOLATED: an
\* honest responder delivering an over-budget anchor block, as the draft
\* requires, is disconnected as a flooder.
SPECIFICATION Spec
CONSTANT MaxBlock = 4
CONSTANT Peers = {"p1", "p2"}
CONSTANT MaxCount = 2
CONSTANT MaxBytes = 3
CONSTANT Sizes = {1, 4}
CONSTANT BuggyFirstInBudget = TRUE
CHECK_DEADLOCK FALSE
INVARIANT NoHonestFlood
