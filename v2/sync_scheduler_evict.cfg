\* Honest registry handling, but disconnected peers are never redialled.
\* EventuallyAllVerified is expected to be VIOLATED: two consecutive timeouts
\* evict the only holder of block 2 under the unresponsive-peer rule
\* (zebra#11276), and without a redial the sync stalls even though every
\* registry entry is honest. The redial loop is load-bearing for liveness.
SPECIFICATION Spec
CONSTANT Peers = {"p_tip", "p_lag"}
CONSTANT MaxBlock = 2
CONSTANT LaggingPeers = {"p_lag"}
CONSTANT LagTip = 1
CONSTANT MaxRetries = 2
CONSTANT UnresponsiveLimit = 2
CONSTANT TreatRefusedAsMissing = FALSE
CONSTANT TreatTruncatedAsMissing = FALSE
CONSTANT BuggyTimeout = FALSE
CONSTANT Redial = FALSE
CHECK_DEADLOCK FALSE
PROPERTY EventuallyAllVerified
INVARIANT TypeOK
INVARIANT RegistryHonest
INVARIANT RegistryHasIsSound
INVARIANT VerifiedAreReal
