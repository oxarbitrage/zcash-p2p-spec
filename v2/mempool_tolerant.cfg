\* Tolerant responder: a new subscription observed while an old one is being
\* served supersedes it (its cancel is on the way). Every property is
\* expected to hold.
SPECIFICATION Spec
CONSTANT MaxSubs = 3
CONSTANT StrictSub = FALSE
CHECK_DEADLOCK FALSE
PROPERTY EventuallySubscribed
INVARIANT TypeOK
INVARIANT RequesterSingleton
INVARIANT ResponderSingleton
INVARIANT NoHonestProtocolError
