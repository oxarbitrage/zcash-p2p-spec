\* The misbehavior score is kept per connection instead of keyed by address.
\* PersistentAttackerBanned is expected to be VIOLATED: the attacker emits
\* 20-point violations up to 80, disconnects, reconnects with a clean score,
\* and repeats forever — the draft's stated reason for address-keyed
\* persistent scores.
SPECIFICATION Spec
CONSTANT Peers = {"honest1", "byz1"}
CONSTANT Byzantine = {"byz1"}
CONSTANT BanThreshold = 100
CONSTANT PenalizeNonConnecting = FALSE
CONSTANT PenalizeRequestedInvalid = FALSE
CONSTANT PerConnectionScore = TRUE
CHECK_DEADLOCK FALSE
PROPERTY PersistentAttackerBanned
INVARIANT TypeOK
INVARIANT NoHonestBan
INVARIANT BanIsFinal
