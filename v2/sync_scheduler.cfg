\* Fixed behaviour: only an explicit not-found marks the registry, and
\* disconnected peers are redialled. Every invariant and the liveness
\* property are expected to hold.
SPECIFICATION Spec
CONSTANT Peers = {"p_tip", "p_lag"}
CONSTANT MaxBlock = 2
CONSTANT LaggingPeers = {"p_lag"}
CONSTANT LagTip = 1
CONSTANT MaxRetries = 2
CONSTANT UnresponsiveLimit = 2
CONSTANT TreatRefusedAsMissing = FALSE
CONSTANT TreatTruncatedAsMissing = FALSE
CONSTANT BuggyTimeout = FALSE
CONSTANT Redial = TRUE
CHECK_DEADLOCK FALSE
PROPERTY EventuallyAllVerified
INVARIANT TypeOK
INVARIANT RegistryHonest
INVARIANT RegistryHasIsSound
INVARIANT VerifiedAreReal
