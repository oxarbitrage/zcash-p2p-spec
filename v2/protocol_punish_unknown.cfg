\* Buggy receiver: unknown stream types are treated as a connection error,
\* against the draft's MUST NOT ("Stream Types"). CloseAccountable is
\* expected to be VIOLATED: a stream type from a future protocol revision
\* kills the connection with no genuine violation on record.
\* One honest peer, one Byzantine peer that completes an honest handshake
\* and then commits wire-level mischief: second init records and streams
\* finished before their type byte (genuine violations), plus unknown
\* stream types and unknown handshake-stream records (which the draft says
\* MUST be tolerated). Expected: CloseAccountable holds (the honest
\* receiver never fires PROTOCOL_ERROR without a genuine violation, so the
\* tolerated mischief never kills the connection) and EventuallyPunished
\* holds (every genuine violation ends the connection).
SPECIFICATION Spec

CONSTANT InitialPeers = {"peer1", "peer2"}
CONSTANT MaxStreams = 3
CONSTANT MaxBlock = 1
CONSTANT MaxRestarts = 0
CONSTANT MaxHeaders = 2
CONSTANT MaxBlocksPerRequest = 2
CONSTANT MinVersion = 170200
CONSTANT Versions = {170200}
CONSTANT StrictSingleton = FALSE
CONSTANT ByzantinePeers = {"peer2"}
CONSTANT MaxMischief = 2
CONSTANT PunishUnknownType = TRUE
CONSTANT RefusePreHandshake = FALSE

CHECK_DEADLOCK FALSE

INVARIANT CloseAccountable
