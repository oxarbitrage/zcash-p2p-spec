\* Two peers, receiver refuses announcement streams that arrive before its own
\* handshake completes (draft: "Connection Handshake", MAY refuse with
\* REFUSED). The sender reopens after each refusal. All properties are
\* expected to hold: refusal is not a connection error, and fairness on
\* RecvInit ends the refuse/reopen loop.
SPECIFICATION Spec

CONSTANT InitialPeers = {"peer1", "peer2"}
CONSTANT MaxStreams = 3
CONSTANT MaxBlock = 2
CONSTANT MaxRestarts = 1
CONSTANT MinVersion = 170200
CONSTANT Versions = {170200}
CONSTANT StrictSingleton = FALSE
CONSTANT RefusePreHandshake = TRUE

CHECK_DEADLOCK FALSE

PROPERTY HandshakeCompletes
PROPERTY AnnouncementsFlow

INVARIANT TypeOK
INVARIANT SlotsConsistent
INVARIANT OneHandshakeStream
INVARIANT HandshakeBeforeStreams
INVARIANT NegotiatedVersionIsMin
INVARIANT SenderSingleton
INVARIANT CloseJustified
INVARIANT NoHonestProtocolError
