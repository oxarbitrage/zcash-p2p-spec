name: TLA+ Model Checking

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  model_check_2peers:
    name: 2 peers (complete verification)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Download TLC tools
      run: wget https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar

    - name: Run TLC model checker (2 peers)
      run: |
        timeout 300 java -jar tla2tools.jar -config protocol.cfg protocol.tla

  model_check_3peers:
    name: 3 peers with symmetry (bounded verification)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Download TLC tools
      run: wget https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar

    - name: Run TLC model checker (3 peers, symmetry)
      run: |
        timeout 120 java -jar tla2tools.jar -config protocol_3peers.cfg protocol.tla || true

  model_check_sync_scheduler:
    name: sync scheduler (stall reproduction)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Download TLC tools
      run: wget https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar

    - name: Fixed behaviour must verify (no error)
      run: |
        timeout 120 java -jar tla2tools.jar -config sync_scheduler_fixed.cfg sync_scheduler.tla

    - name: Buggy behaviour must reproduce the liveness stall
      run: |
        if timeout 120 java -jar tla2tools.jar -config sync_scheduler_buggy.cfg sync_scheduler.tla; then
          echo "ERROR: expected EventuallyAllVerified to be violated, but TLC found no error"
          exit 1
        else
          echo "OK: stall reproduced as expected"
        fi

    - name: Buggy behaviour must violate registry honesty
      run: |
        if timeout 120 java -jar tla2tools.jar -config sync_scheduler_poison.cfg sync_scheduler.tla; then
          echo "ERROR: expected RegistryHonest to be violated, but TLC found no error"
          exit 1
        else
          echo "OK: registry poisoning reproduced as expected"
        fi

  model_check_v2:
    name: v2 protocol (draft ZIP, stream layer + handshake)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Download TLC tools
      run: wget https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar

    - name: Tolerant receiver must verify (2 peers, complete)
      working-directory: v2
      run: |
        timeout 300 java -jar ../tla2tools.jar -workers auto -config protocol.cfg protocol.tla

    - name: Refusing pre-handshake streams must verify
      working-directory: v2
      run: |
        timeout 300 java -jar ../tla2tools.jar -workers auto -config protocol_refuse.cfg protocol.tla

    - name: Obsolete peers must be closed with OBSOLETE only
      working-directory: v2
      run: |
        timeout 300 java -jar ../tla2tools.jar -workers auto -config protocol_obsolete.cfg protocol.tla

    - name: Strict receiver must disconnect honest peers (announcement stream replacement race)
      working-directory: v2
      run: |
        if timeout 300 java -jar ../tla2tools.jar -workers auto -config protocol_strict.cfg protocol.tla; then
          echo "ERROR: expected NoHonestProtocolError to be violated, but TLC found no error"
          exit 1
        else
          echo "OK: replacement race reproduced as expected"
        fi

    - name: 3 peers with symmetry (bounded)
      working-directory: v2
      run: |
        timeout 120 java -jar ../tla2tools.jar -workers auto -config protocol_3peers.cfg protocol.tla || true
