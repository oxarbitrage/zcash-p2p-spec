name: TLA+ Model Checking

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  model_check_2peers:
    name: 2 peers (complete verification)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Download TLC tools
      run: wget https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar

    - name: Run TLC model checker (2 peers)
      run: |
        timeout 300 java -jar tla2tools.jar -config protocol.cfg protocol.tla

  model_check_3peers:
    name: 3 peers with symmetry (bounded verification)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Download TLC tools
      run: wget https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar

    - name: Run TLC model checker (3 peers, symmetry)
      run: |
        timeout 120 java -jar tla2tools.jar -config protocol_3peers.cfg protocol.tla || true

  model_check_sync_scheduler:
    name: sync scheduler (stall reproduction)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Download TLC tools
      run: wget https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar

    - name: Fixed behaviour must verify (no error)
      run: |
        timeout 120 java -jar tla2tools.jar -config sync_scheduler_fixed.cfg sync_scheduler.tla

    - name: Buggy behaviour must reproduce the liveness stall
      run: |
        if timeout 120 java -jar tla2tools.jar -config sync_scheduler_buggy.cfg sync_scheduler.tla; then
          echo "ERROR: expected EventuallyAllVerified to be violated, but TLC found no error"
          exit 1
        else
          echo "OK: stall reproduced as expected"
        fi

    - name: Buggy behaviour must violate registry honesty
      run: |
        if timeout 120 java -jar tla2tools.jar -config sync_scheduler_poison.cfg sync_scheduler.tla; then
          echo "ERROR: expected RegistryHonest to be violated, but TLC found no error"
          exit 1
        else
          echo "OK: registry poisoning reproduced as expected"
        fi

  model_check_v2:
    name: v2 protocol (draft ZIP)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Download TLC tools
      run: wget https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar

    - name: Headers-first sync must verify (2 peers, complete)
      working-directory: v2
      run: |
        timeout 600 java -jar ../tla2tools.jar -workers auto -config protocol.cfg protocol.tla

    - name: Announcement stream replacement must verify (2 peers, complete)
      working-directory: v2
      run: |
        timeout 1200 java -jar ../tla2tools.jar -workers auto -config protocol_restart.cfg protocol.tla

    - name: Refusing pre-handshake streams must verify
      working-directory: v2
      run: |
        timeout 300 java -jar ../tla2tools.jar -workers auto -config protocol_refuse.cfg protocol.tla

    - name: Obsolete peers must be closed with OBSOLETE only
      working-directory: v2
      run: |
        timeout 300 java -jar ../tla2tools.jar -workers auto -config protocol_obsolete.cfg protocol.tla

    - name: Strict receiver must disconnect honest peers (announcement stream replacement race)
      working-directory: v2
      run: |
        if timeout 300 java -jar ../tla2tools.jar -workers auto -config protocol_strict.cfg protocol.tla; then
          echo "ERROR: expected NoHonestProtocolError to be violated, but TLC found no error"
          exit 1
        else
          echo "OK: replacement race reproduced as expected"
        fi

    - name: Byzantine mischief must be punished, tolerated mischief must not
      working-directory: v2
      run: |
        timeout 600 java -jar ../tla2tools.jar -workers auto -config protocol_byzantine.cfg protocol.tla

    - name: Punishing unknown stream types must break accountability
      working-directory: v2
      run: |
        if timeout 300 java -jar ../tla2tools.jar -workers auto -config protocol_punish_unknown.cfg protocol.tla; then
          echo "ERROR: expected CloseAccountable to be violated, but TLC found no error"
          exit 1
        else
          echo "OK: forward-compatibility close reproduced as expected"
        fi

    - name: 3 peers with symmetry (bounded)
      working-directory: v2
      run: |
        timeout 120 java -jar ../tla2tools.jar -workers auto -config protocol_3peers.cfg protocol.tla || true

    - name: Scheduler must refine the downloader abstraction
      working-directory: v2
      run: |
        timeout 120 java -jar ../tla2tools.jar -config sched_refinement.cfg sched_refinement.tla

    - name: Protocol must refine the downloader abstraction (2 peers, complete)
      working-directory: v2
      run: |
        timeout 600 java -jar ../tla2tools.jar -workers auto -config refinement.cfg refinement.tla

    - name: v2 scheduler fixed behaviour must verify
      working-directory: v2
      run: |
        timeout 120 java -jar ../tla2tools.jar -config sync_scheduler.cfg sync_scheduler.tla

    - name: Refused-as-missing must violate registry honesty
      working-directory: v2
      run: |
        if timeout 120 java -jar ../tla2tools.jar -config sync_scheduler_refused.cfg sync_scheduler.tla; then
          echo "ERROR: expected RegistryHonest to be violated, but TLC found no error"
          exit 1
        else
          echo "OK: refused-as-missing poisoning reproduced as expected"
        fi

    - name: Truncated-as-missing must reproduce the sync stall
      working-directory: v2
      run: |
        if timeout 120 java -jar ../tla2tools.jar -config sync_scheduler_truncated.cfg sync_scheduler.tla; then
          echo "ERROR: expected EventuallyAllVerified to be violated, but TLC found no error"
          exit 1
        else
          echo "OK: truncation stall reproduced as expected"
        fi

    - name: Timeout-as-missing must violate registry honesty (legacy regression guard)
      working-directory: v2
      run: |
        if timeout 120 java -jar ../tla2tools.jar -config sync_scheduler_timeout.cfg sync_scheduler.tla; then
          echo "ERROR: expected RegistryHonest to be violated, but TLC found no error"
          exit 1
        else
          echo "OK: legacy timeout poisoning reproduced as expected"
        fi

    - name: Simultaneous dial with a tie-break must converge
      working-directory: v2
      run: |
        timeout 120 java -jar ../tla2tools.jar -config dial_tiebreak.cfg dial.tla

    - name: Symmetric prefer-outbound must flap forever
      working-directory: v2
      run: |
        if timeout 120 java -jar ../tla2tools.jar -config dial_outbound.cfg dial.tla; then
          echo "ERROR: expected EventuallyOneConnection to be violated, but TLC found no error"
          exit 1
        else
          echo "OK: connection flap reproduced as expected"
        fi

    - name: Symmetric prefer-inbound must flap forever
      working-directory: v2
      run: |
        if timeout 120 java -jar ../tla2tools.jar -config dial_inbound.cfg dial.tla; then
          echo "ERROR: expected EventuallyOneConnection to be violated, but TLC found no error"
          exit 1
        else
          echo "OK: connection flap reproduced as expected"
        fi

    - name: get-mempool order-aware supersede must verify
      working-directory: v2
      run: |
        timeout 120 java -jar ../tla2tools.jar -config mempool_tolerant.cfg mempool_sub.tla

    - name: Strict get-mempool singleton must disconnect honest peers (re-subscribe race)
      working-directory: v2
      run: |
        if timeout 120 java -jar ../tla2tools.jar -config mempool_strict.cfg mempool_sub.tla; then
          echo "ERROR: expected NoHonestProtocolError to be violated, but TLC found no error"
          exit 1
        else
          echo "OK: re-subscribe race reproduced as expected"
        fi

    - name: Compact block reconstruction with fallback must verify
      working-directory: v2
      run: |
        timeout 120 java -jar ../tla2tools.jar -config compact.cfg compact_relay.tla

    - name: Compact path without fallback must stall on a lost re-announcement
      working-directory: v2
      run: |
        if timeout 120 java -jar ../tla2tools.jar -config compact_nofallback.cfg compact_relay.tla; then
          echo "ERROR: expected EventuallyHasBlock to be violated, but TLC found no error"
          exit 1
        else
          echo "OK: stale-nonce stall reproduced as expected"
        fi

    - name: Penalizing reconstruction failure must frame an honest sender
      working-directory: v2
      run: |
        if timeout 120 java -jar ../tla2tools.jar -config compact_penalize.cfg compact_relay.tla; then
          echo "ERROR: expected NoHonestPenalty to be violated, but TLC found no error"
          exit 1
        else
          echo "OK: honest nonce churn penalty reproduced as expected"
        fi

    - name: Epoch enforcement across divergent activation must verify
      working-directory: v2
      run: |
        timeout 120 java -jar ../tla2tools.jar -config epoch.cfg epoch.tla
        timeout 120 java -jar ../tla2tools.jar -config epoch_upgrade.cfg epoch.tla

    - name: Banning obsolete peers must strand an upgraded peer
      working-directory: v2
      run: |
        if timeout 120 java -jar ../tla2tools.jar -config epoch_ban.cfg epoch.tla; then
          echo "ERROR: expected CatchesUp to be violated, but TLC found no error"
          exit 1
        else
          echo "OK: obsolete-ban stranding reproduced as expected"
        fi

    - name: Misbehavior fixed behaviour must verify
      working-directory: v2
      run: |
        timeout 120 java -jar ../tla2tools.jar -config misbehavior.cfg misbehavior.tla

    - name: Penalizing non-connecting headers must ban an honest peer
      working-directory: v2
      run: |
        if timeout 120 java -jar ../tla2tools.jar -config misbehavior_nonconnecting.cfg misbehavior.tla; then
          echo "ERROR: expected NoHonestBan to be violated, but TLC found no error"
          exit 1
        else
          echo "OK: honest divergent peer banned as expected"
        fi

    - name: Penalizing requested invalid blocks must ban an honest peer
      working-directory: v2
      run: |
        if timeout 120 java -jar ../tla2tools.jar -config misbehavior_requested.cfg misbehavior.tla; then
          echo "ERROR: expected NoHonestBan to be violated, but TLC found no error"
          exit 1
        else
          echo "OK: honest serving peer banned as expected"
        fi

    - name: Per-connection scores must let a persistent attacker evade the ban
      working-directory: v2
      run: |
        if timeout 120 java -jar ../tla2tools.jar -config misbehavior_perconn.cfg misbehavior.tla; then
          echo "ERROR: expected PersistentAttackerBanned to be violated, but TLC found no error"
          exit 1
        else
          echo "OK: score-shedding evasion reproduced as expected"
        fi

    - name: Eviction without redial must reproduce the sync stall
      working-directory: v2
      run: |
        if timeout 120 java -jar ../tla2tools.jar -config sync_scheduler_evict.cfg sync_scheduler.tla; then
          echo "ERROR: expected EventuallyAllVerified to be violated, but TLC found no error"
          exit 1
        else
          echo "OK: unresponsive-peer eviction stall reproduced as expected"
        fi
