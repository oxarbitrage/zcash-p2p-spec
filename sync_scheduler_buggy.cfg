SPECIFICATION Spec

\* A degraded peer set: p_tip holds both blocks, p_lag holds only block 1.
\* Block 2 is therefore available from exactly one peer — the at-tip minority.
CONSTANT Peers = {"p_tip", "p_lag"}
CONSTANT MaxBlock = 2
CONSTANT LaggingPeers = {"p_lag"}
CONSTANT LagTip = 1
CONSTANT MaxRetries = 2

\* Zebra pre-fix behaviour: transient errors poison the registry and notfound
\* silently drops the block.
CONSTANT BuggyRouting = TRUE
CONSTANT BuggyDrop = TRUE

CHECK_DEADLOCK FALSE

\* The sound invariants still hold under the buggy switches.
INVARIANT TypeOK
INVARIANT RegistryHasIsSound
INVARIANT VerifiedAreReal

\* Expected to FAIL: the genesis-to-tip stall. Block 2 is requested from p_lag
\* (which lacks it), notfound, then silently dropped — the frontier wedges at {1}
\* forever. (RegistryHonest is exercised separately in sync_scheduler_poison.cfg;
\* it would also fail here, but as an invariant it would halt the run before the
\* liveness property is reached.)
PROPERTY EventuallyAllVerified
